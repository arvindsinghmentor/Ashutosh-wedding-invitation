<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Link preview images (1200x630) for /rsvp/ and the guest cards. Designed by Arvind Singh.
     Render: msedge --headless --window-size=1200,630 --screenshot=out.png "tools/make-previews.html?t=rsvp|key|bus|train" -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1417;--mar:#7b1e2b;--gold:#b8862b;--paper:#fbf4e6;--line:#e2cfa6;--mute:#7d5f50}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(circle at 18% 0,#fff,var(--paper) 55%);font-family:Mukta,sans-serif;color:var(--ink);position:relative}
.H{font-family:'Cormorant Garamond',serif;font-weight:700}
.fr{position:absolute;inset:22px;border:2px solid var(--gold);border-radius:6px}
.fr::after{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px}
.l{position:absolute;left:84px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.sh{color:var(--gold);font-size:24px;letter-spacing:.06em}
.nm{font-size:70px;color:var(--mar);line-height:1;margin:10px 0 6px}
.k{font:700 24px 'Cormorant Garamond',serif;letter-spacing:.42em;color:var(--gold)}
.tt{font-size:52px;color:var(--ink);line-height:1.05;margin:30px 0 8px}
.sub{font-size:25px;color:var(--mute);line-height:1.35}
.dt{margin-top:26px;display:inline-flex;align-self:flex-start;gap:10px;align-items:center;background:var(--mar);color:#fff;border-radius:40px;padding:9px 26px;font-size:22px;font-weight:600}
.dt i{width:8px;height:8px;border-radius:50%;background:#e8c98a}
.r{position:absolute;right:84px;top:50%;transform:translateY(-50%)}
/* RSVP sheet */
.ph{width:380px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 26px 28px;box-shadow:0 24px 50px rgba(91,20,30,.22);transform:rotate(3deg)}
.ph .q{font-size:36px;color:var(--mar);text-align:center;margin-bottom:16px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn div{border:2px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center;font-size:19px;font-weight:600}
.yn .on{border-color:var(--mar);background:#fbeef0;color:var(--mar)}
.yn svg{width:30px;height:30px;display:block;margin:0 auto 6px;fill:none;stroke:currentColor;stroke-width:1.8}
.f{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fffdf8;font-size:19px;color:#a68a72}
.f b{display:block;font-size:13px;letter-spacing:.06em;color:var(--mute);font-weight:600}
.go{margin-top:18px;background:#1f8a4c;color:#fff;border-radius:30px;text-align:center;padding:13px;font-size:21px;font-weight:600}
/* key card */
.key{width:400px;border-radius:24px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 26px 56px rgba(60,20,20,.3);transform:rotate(-4deg)}
.kt{background:var(--mar);color:#fff;padding:24px 26px;position:relative}
.kt .s{color:#e8c98a;font-size:18px;letter-spacing:.06em}.kt b{display:block;font-size:36px;margin-top:2px}
.chip{position:absolute;right:24px;top:28px;width:62px;height:46px;border-radius:9px;background:linear-gradient(135deg,#f0d59a,#b8862b);box-shadow:inset 0 0 0 1px #8a6420}
.chip::before,.chip::after{content:"";position:absolute;left:11px;right:11px;top:15px;border-top:1.5px solid #8a6420}.chip::after{top:30px}
.km{text-align:center;padding:24px 20px 26px}
.km .lb{color:var(--mute);font-size:19px}
.km svg{width:120px;height:120px;fill:none;stroke:var(--mar);stroke-width:1.6;margin:6px 0}
.km .v{font-size:28px;color:var(--ink)}
/* ticket */
.tk{width:430px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 26px 56px rgba(60,20,20,.28);transform:rotate(3deg);overflow:hidden}
.tk .top{background:var(--mar);color:#fff;padding:22px 26px;display:flex;align-items:center;gap:16px}
.tk .top svg{width:54px;height:54px;fill:none;stroke:#e8c98a;stroke-width:1.7;flex:none}
.tk .top .s{color:#e8c98a;font-size:17px;letter-spacing:.06em}.tk .top b{display:block;font-size:34px;line-height:1.05}
.rt{display:flex;align-items:center;gap:14px;padding:26px 26px 10px}
.rt .p{font-size:16px;color:var(--mute);line-height:1.2}.rt .p b{display:block;font-size:30px;color:var(--ink);font-family:'Cormorant Garamond',serif}
.rt .ln{flex:1;border-top:2px dashed var(--gold);position:relative}
.rt .ln::after{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--gold);transform:translateX(-50%)}
.seats{display:flex;gap:10px;padding:12px 26px 26px}
.seats div{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fffdf8;font-size:14px;color:var(--mute);letter-spacing:.05em}
.seats b{display:block;font-size:22px;color:var(--mar);letter-spacing:0}
.cut{border-top:2px dashed var(--line);margin:0 18px}
</style></head><body><div class="fr"></div>
<div class="l"><div class="sh">॥ श्री गणेशाय नमः ॥</div><div class="nm H">Ashutosh &amp; Shrusti</div><div class="k" id="k"></div>
<div class="tt H" id="tt"></div><div class="sub" id="sub"></div><div class="dt" id="dt"></div></div>
<div class="r" id="r"></div>
<script>
const I={heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 key:'<circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14 9l2 2"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="13.5" r=".8"/><circle cx="15" cy="13.5" r=".8"/>'};
const s=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const ticket=(k,name,from,to,a,av,b,bv)=>`<div class="tk"><div class="top">${s(k)}<div><div class="s">Ashutosh weds Shrusti</div><b class="H">${name}</b></div></div>
 <div class="rt"><div class="p"><b>${from}</b>From</div><div class="ln"></div><div class="p" style="text-align:right"><b>${to}</b>To</div></div><div class="cut"></div>
 <div class="seats"><div>${a}<b>${av}</b></div><div>${b}<b>${bv}</b></div><div>DATE<b>Dec</b></div></div></div>`;
const T={
 rsvp:['R.S.V.P.','Will you join us?','Tell us about your family, stay and travel.<br>Takes about one minute.','28 Nov – 2 Dec 2026 · Gwalior &amp; Ujjain',
  `<div class="ph"><div class="q H">Will you join us?</div><div class="yn"><div class="on">${s('heart')}Yes, we’ll be there</div><div>${s('person')}Sorry, can’t make it</div></div>
   <div class="f"><b>YOUR FULL NAME</b>Your name</div><div class="f"><b>NEED A ROOM AT THE RESORT?</b>Yes, please</div><div class="go">Send on WhatsApp</div></div>`],
 key:['ROOM KEY','Your room is ready','Show this card at the reception.<br>Pukhraj Club &amp; Resort, Ujjain','1–2 December 2026',
  `<div class="key"><div class="kt"><div class="s">Ashutosh weds Shrusti</div><b class="H">Room key card</b><div class="chip"></div></div><div class="km"><div class="lb">Your room</div>${s('key')}<div class="v H">Pukhraj Club &amp; Resort</div></div></div>`],
 bus:['BUS CARD','Your bus seat','Seat, pickup point and driver details<br>for your journey.','1–2 December 2026',ticket('bus','Baarat bus','Gwalior','Ujjain','BUS','1','SEAT','12')],
 train:['TRAIN CARD','Your train ticket','Train, coach, seat and PNR<br>for your journey.','1–2 December 2026',ticket('train','Train ticket','Your city','Ujjain','COACH','B2','SEAT','34')]
};
const t=T[new URLSearchParams(location.search).get('t')]||T.rsvp;
k.textContent=t[0];tt.textContent=t[1];sub.innerHTML=t[2];dt.innerHTML='<i></i>'+t[3];r.innerHTML=t[4];
</script></body></html>
