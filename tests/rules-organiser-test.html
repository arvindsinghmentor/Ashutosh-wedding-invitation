<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Arvind Singh"><title>Rules test</title>
<style>body{font:16px system-ui;margin:24px;background:#fbf4e6;color:#3b1417}button{font:inherit;padding:10px 18px;border-radius:99px;border:0;background:#7b1e2b;color:#fff}pre{white-space:pre-wrap}</style>
</head><body>
<h1>Organiser rules test</h1>
<p>Sign in with the organiser Google account. The test writes and then deletes a few test documents.</p>
<button id="go">Sign in with Google and run</button>
<pre id="out"></pre>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, getDocs, query, where, doc, setDoc, updateDoc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig } from '../firebase-config.js';

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const out = document.getElementById('out'), log = s => out.textContent += s + '\n';

document.getElementById('go').onclick = async () => {
  out.textContent = '';
  try { const u = (await signInWithPopup(auth, new GoogleAuthProvider())).user; log('Signed in as ' + u.email); }
  catch (e) { log('Sign-in failed: ' + e.code); return; }
  let fails = 0;
  const t = async (name, fn) => { try { await fn(); log('PASS  ' + name); } catch (e) { fails++; log('FAIL  ' + name + '  (' + e.code + ')'); } };
  let tests = [];
  await t('organiser can read RSVPs', async () => { tests = (await getDocs(query(collection(db, 'rsvps'), where('n', '==', 'RULES TEST')))).docs; });
  await t('organiser can update an RSVP (assign room)', async () => { for (const d of tests) await updateDoc(d.ref, { room: '000' }); });
  await t('organiser can write rooms', () => setDoc(doc(db, 'rooms', 'rules-test'), { name: 'test' }));
  await t('organiser can read rooms', () => getDoc(doc(db, 'rooms', 'rules-test')));
  await t('organiser can write meta', () => setDoc(doc(db, 'meta', 'rules-test'), { ok: 1 }));
  await t('organiser can write tasks, contacts, vehicles', async () => {
    for (const c of ['tasks', 'contacts', 'vehicles']) { await setDoc(doc(db, c, 'rules-test'), { x: 1 }); await deleteDoc(doc(db, c, 'rules-test')); } });
  await t('organiser can manage the organiser list', async () => {
    await setDoc(doc(db, 'organisers', 'rules-test@example.com'), { name: 'test' }); await deleteDoc(doc(db, 'organisers', 'rules-test@example.com')); });
  await t('clean up test documents', async () => {
    for (const d of tests) await deleteDoc(d.ref);
    await deleteDoc(doc(db, 'rooms', 'rules-test')); await deleteDoc(doc(db, 'meta', 'rules-test')); });
  log(fails ? fails + ' failed' : 'All organiser checks passed (' + tests.length + ' test RSVPs removed)');
  await auth.signOut();
};
</script>
</body></html>
